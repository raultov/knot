# Spring Boot Application Configuration
server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/myapp
    username: root
    password: secret123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

logging:
  level:
    root: INFO
    com.example.myapp: DEBUG
    org.springframework: WARN

app:
  name: My Application
  version: 1.0.0
  features:
    - feature-a
    - feature-b
    - feature-c
